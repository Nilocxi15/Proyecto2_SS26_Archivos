<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
  <div class="container-fluid px-lg-4">
    <!-- Logotipo y Nombre del Sistema -->
    <a
      class="navbar-brand d-flex align-items-center fw-bold me-4"
      href="javascript:void(0)"
      (click)="selectSection('my-files')"
    >
      <i class="bi bi-folder2-open fs-4 me-2"></i>
      <span>Gestión Documental</span>
    </a>

    <!-- Botón hamburguesa responsive -->
    <button
      class="navbar-toggler border-0"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sharedNavbarContent"
      aria-controls="sharedNavbarContent"
      aria-expanded="false"
      aria-label="Alternar navegación"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Opciones de Navegación -->
    <div class="collapse navbar-collapse" id="sharedNavbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Mis archivos -->
        <li class="nav-item">
          <button
            class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
            [class.active]="activeSection() === 'my-files'"
            (click)="selectSection('my-files')"
          >
            <i class="bi bi-folder2-open me-2"></i>
            <span>Mis archivos</span>
          </button>
        </li>

        <!-- Compartido conmigo -->
        <li class="nav-item">
          <button
            class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
            [class.active]="activeSection() === 'shared'"
            (click)="selectSection('shared')"
          >
            <i class="bi bi-people me-2"></i>
            <span>Compartido conmigo</span>
          </button>
        </li>

        <!-- Papelera -->
        <li class="nav-item">
          <button
            class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
            [class.active]="activeSection() === 'trash'"
            (click)="selectSection('trash')"
          >
            <i class="bi bi-trash3 me-2"></i>
            <span>Papelera</span>
          </button>
        </li>

        <!-- OPCIONES EXCLUSIVAS PARA ADMINISTRADOR -->
        @if (isEffectiveAdmin()) {
          <!-- Gestionar usuarios -->
          <li class="nav-item">
            <button
              class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
              [class.active]="activeSection() === 'users'"
              (click)="selectSection('users')"
            >
              <i class="bi bi-person-gear me-2"></i>
              <span>Gestionar usuarios</span>
            </button>
          </li>

          <!-- Historial de actividad -->
          <li class="nav-item">
            <button
              class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
              [class.active]="activeSection() === 'activity'"
              (click)="selectSection('activity')"
            >
              <i class="bi bi-clock-history me-2"></i>
              <span>Historial de actividad</span>
            </button>
          </li>

          <!-- Reportes del sistema -->
          <li class="nav-item">
            <button
              class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
              [class.active]="activeSection() === 'reports'"
              (click)="selectSection('reports')"
            >
              <i class="bi bi-bar-chart-line-fill me-2"></i>
              <span>Reportes del sistema</span>
            </button>
          </li>
        }

        <!-- Mi perfil -->
        <li class="nav-item">
          <button
            class="nav-link btn btn-link text-decoration-none d-flex align-items-center px-3"
            [class.active]="activeSection() === 'profile'"
            (click)="selectSection('profile')"
          >
            <i class="bi bi-person-circle me-2"></i>
            <span>Mi perfil</span>
          </button>
        </li>
      </ul>

      <!-- Opciones de Usuario a la Derecha -->
      <div class="d-flex align-items-center gap-2 text-white">
        <!-- Indicador de Perfil y Rol (Clickeable para ir a Mi perfil) -->
        <button
          type="button"
          class="btn btn-link text-decoration-none text-white d-flex align-items-center bg-white bg-opacity-10 rounded-pill px-3 py-1 border border-light border-opacity-25"
          [class.bg-opacity-25]="activeSection() === 'profile'"
          (click)="selectSection('profile')"
          title="Ver mi perfil y almacenamiento"
        >
          <i class="bi bi-person-circle me-2 fs-6"></i>
          <span class="fw-medium small text-truncate" style="max-width: 150px">{{
            currentUser()?.name || currentUser()?.nombre || 'Mi Perfil'
          }}</span>
          @if (isEffectiveAdmin()) {
            <span class="badge bg-warning text-dark ms-2 rounded-pill small fw-bold">Admin</span>
          } @else {
            <span class="badge bg-light text-primary ms-2 rounded-pill small">Usuario</span>
          }
        </button>

        <!-- Botón: Cerrar sesión -->
        <button
          type="button"
          class="btn btn-light btn-sm text-danger fw-semibold d-flex align-items-center rounded-pill px-3 py-1 shadow-sm ms-2"
          (click)="logout()"
          title="Cerrar sesión actual"
        >
          <i class="bi bi-box-arrow-right me-1"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  </div>
</nav>
