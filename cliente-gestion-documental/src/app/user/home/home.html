<!-- Layout General de Usuario: Navbar Superior -->
<app-navbar [activeSection]="activeSection()" (sectionChange)="changeSection($event)"></app-navbar>

<!-- Contenido Dinámico de la Sección Seleccionada -->
<main class="container-fluid py-4 px-lg-5">
  <!-- Sección Mis Archivos -->
  @if (activeSection() === 'my-files') {
    <app-mis-archivos></app-mis-archivos>
  }

  <!-- Sección Compartido conmigo -->
  @if (activeSection() === 'shared') {
    <app-compartido-conmigo></app-compartido-conmigo>
  }

  <!-- Sección Papelera -->
  @if (activeSection() === 'trash') {
    <app-papelera></app-papelera>
  }

  <!-- Sección Mi Perfil -->
  @if (activeSection() === 'profile') {
    <app-user-profile></app-user-profile>
  }
</main>
